{% extends "base.html" %}

{% block title %}
  Выход из системы
{% endblock %}

{% block content %}
  <div class="col d-flex justify-content-center">
    <div class="card" style="width: 40rem; background-color: #2a2a2a;">
      <div class="card-header" style="background-color: #dc3545; color: #1a1a1a; font-weight: bold;">
        <i class="fas fa-sign-out-alt me-2"></i>Выход из системы
      </div>
      <div class="card-body text-center">
        <i class="fas fa-check-circle" style="font-size: 48px; color: #28a745; margin-bottom: 20px;"></i>
        <p class="mb-4" style="color: #e0e0e0;">Вы успешно вышли из системы!</p>
        <div class="d-flex justify-content-center gap-3">
          <a href="{% url 'login' %}" class="btn btn-outline-danger">
            <i class="fas fa-sign-in-alt me-1"></i>Войти снова
          </a>
          <a href="{% url 'product:index' %}" class="btn btn-outline-danger">
            <i class="fas fa-home me-1"></i>На главную
          </a>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
