{% extends "base.html" %}

{% block title %}
  Инструкция отправлена
{% endblock %}

{% block content %}
  <div class="col d-flex justify-content-center">
    <div class="card" style="width: 40rem; background-color: #2a2a2a;">
      <div class="card-header" style="background-color: #dc3545; color: #1a1a1a; font-weight: bold;">
        <i class="fas fa-envelope me-2"></i>Письмо отправлено
      </div>
      <div class="card-body text-center">
        <i class="fas fa-paper-plane" style="font-size: 48px; color: #dc3545; margin-bottom: 20px;"></i>
        <p class="mb-4" style="color: #e0e0e0;">
          Мы отправили вам инструкцию по восстановлению пароля на email.
          Если письмо не пришло в течение нескольких минут, проверьте папку "Спам".
        </p>
        <a href="{% url 'login' %}" class="btn btn-outline-danger">
          <i class="fas fa-sign-in-alt me-1"></i>Вернуться ко входу
        </a>
      </div>
    </div>
  </div>
{% endblock %}
