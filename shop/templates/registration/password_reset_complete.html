{% extends "base.html" %}

{% block title %}
  Пароль изменён
{% endblock %}

{% block content %}
  <div class="col d-flex justify-content-center">
    <div class="card" style="width: 40rem; background-color: #2a2a2a;">
      <div class="card-header" style="background-color: #dc3545; color: #1a1a1a; font-weight: bold;">
        <i class="fas fa-check-circle me-2"></i>Пароль изменён
      </div>
      <div class="card-body text-center">
        <i class="fas fa-shield-alt" style="font-size: 48px; color: #28a745; margin-bottom: 20px;"></i>
        <p class="mb-4" style="color: #e0e0e0;">Ваш пароль был успешно изменён!</p>
        <a href="{% url 'login' %}" class="btn btn-danger">
          <i class="fas fa-sign-in-alt me-1"></i>Войти с новым паролем
        </a>
      </div>
    </div>
  </div>
{% endblock %}
