<div class="card mb-3">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <h6 class="card-subtitle mb-2" style="color: #dc3545;">
          @{{ review.author.username }}
        </h6>
        {% if '/profile/' in request.path %}
          <small class="text-muted">
            Товар: <a href="{% url 'product:product_detail' review.product.id %}">{{ review.product.name }}</a>
          </small>
        {% endif %}
        <div><small class="text-muted">{{ review.created_at|date:"d.m.Y H:i" }}</small></div>
      </div>
    </div>
    <p class="card-text mt-2">{{ review.text|linebreaksbr }}</p>
  </div>
  {% if user == review.author %}
    <div class="mt-3">
      <a href="{% url 'product:edit_review' review.product.id review.id %}" class="btn btn-sm btn-outline-secondary">
        ✏️ Редактировать
      </a>
      <a href="{% url 'product:delete_review' review.product.id review.id %}" class="btn btn-sm btn-outline-danger">
        🗑️ Удалить
      </a>
    </div>
  {% endif %}
</div>
