{% load static %}
<div class="col">
  <div class="card h-100 shadow-sm">
    <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}" style="height: 200px; object-fit: cover;">
    <div class="card-body">
      <h5 class="card-title">{{ product.name }}</h5>
      <p class="card-text fw-bold" style="color: #dc3545;">{{ product.price }} ₽</p>
      <div class="d-flex justify-content-between mt-3">
        <a href="{% url 'product:product_detail' product.id %}" class="btn btn-sm btn-outline-secondary">
          Подробнее
        </a>
        {% include "includes/product_buttons.html" with product=product %}
      </div>
      {% if show_delete_button %}
        <div class="mt-2">
            <form method="post" action="{% url delete_url product.id %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-danger w-100">
                    <i class="fas fa-trash-alt me-1"></i> Удалить
                </button>
            </form>
        </div>
      {% endif %}
    </div>
  </div>
</div>
