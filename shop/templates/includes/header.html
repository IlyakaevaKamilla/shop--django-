{% load static %}
<header>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1a1a1a;">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'product:index' %}">
        <img src="{% static 'img/logo.png' %}" width="30" height="30" class="d-inline-block align-top" alt="Логотип">
        <span class="ms-2" style="color: #dc3545;">Товары для дома</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          {% if user.is_authenticated %}
            <!-- Выпадающее меню для авторизованного пользователя -->
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle d-flex align-items-center" 
                 href="#" 
                 id="userDropdown" 
                 role="button" 
                 data-bs-toggle="dropdown" 
                 aria-expanded="false">
                <i class="fas fa-user-circle me-2"></i>
                <span style="color: #dc3545;">{{ user.username }}</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown" style="background-color: #2a2a2a;">
                <li>
                  <a class="dropdown-item" href="{% url 'product:profile' user.username %}" style="color: #dc3545;">
                    <i class="fas fa-id-card me-2"></i>Мой профиль
                  </a>
                </li>
                <li>
                  <a class="dropdown-item" href="{% url 'product:favoriites' %}" style="color: #dc3545;">
                    <i class="fas fa-heart me-2"></i>Избранное
                  </a>
                </li>
                <li>
                  <a class="dropdown-item" href="#" style="color: #dc3545;">
                    <i class="fas fa-shopping-cart me-2"></i>Корзина
                  </a>
                </li>
                <li><hr class="dropdown-divider" style="background-color: #dc3545;"></li>
                <li>
                  <form method="post" action="{% url 'logout' %}" class="dropdown-item p-0">
                    {% csrf_token %}
                    <button type="submit" class="dropdown-item" style="color: #dc3545;">
                      <i class="fas fa-sign-out-alt me-2"></i>Выйти
                    </button>
                  </form>
                </li>
              </ul>
            </li>
          {% else %}
            <!-- Кнопки для неавторизованного пользователя -->
            <li class="nav-item me-2">
              <a href="{% url 'login' %}" class="btn" style="background-color: transparent; color: #1a1a1a; border: 1px solid #dc3545;;">
                <i class="fas fa-sign-in-alt me-1"></i>Войти
              </a>
            </li>
            <li class="nav-item">
              <a href="{% url 'registration' %}" class="btn" style="background-color: transparent; color: #dc3545; border: 1px solid #dc3545;">
                <i class="fas fa-user-plus me-1"></i>Регистрация
              </a>
            </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
</header>
